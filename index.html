<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HETZA — Appar & Verktyg</title>
  <style>
    /* ─── Design Tokens ─────────────────────────────────────── */
    :root {
      --bg:          #0d0f14;
      --surface:     #13161e;
      --card:        rgba(255,255,255,0.04);
      --card-hover:  rgba(255,255,255,0.08);
      --border:      rgba(255,255,255,0.08);
      --border-glow: rgba(99,179,237,0.35);
      --text:        #e2e8f0;
      --muted:       #64748b;
      --accent-1:    #63b3ed;   /* blå */
      --accent-2:    #68d391;   /* grön */
      --accent-3:    #f6ad55;   /* orange */
      --accent-4:    #b794f4;   /* lila */
      --radius:      14px;
      --transition:  0.25s cubic-bezier(.4,0,.2,1);
    }

    /* ─── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(99,179,237,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(104,211,145,0.06) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ────────────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ─── Header ────────────────────────────────────────────── */
    header {
      padding: 4rem 0 3rem;
      text-align: center;
    }

    .logo {
      display: inline-block;
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .5rem;
    }

    .tagline {
      color: var(--muted);
      font-size: 1.05rem;
    }

    /* ─── Search ────────────────────────────────────────────── */
    .search-wrap {
      max-width: 480px;
      margin: 2rem auto 0;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: .75rem 1rem .75rem 2.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #search:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px rgba(99,179,237,.12);
    }

    #search::placeholder { color: var(--muted); }

    /* ─── Category Section ──────────────────────────────────── */
    .category {
      margin-top: 3.5rem;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .category-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .category-title {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }

    .category-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .category-count {
      font-size: .8rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .15rem .6rem;
    }

    /* ─── Card Grid ─────────────────────────────────────────── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    /* ─── App Card ──────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition:
        background var(--transition),
        border-color var(--transition),
        transform var(--transition),
        box-shadow var(--transition);
      cursor: pointer;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--card-accent, transparent) 0%, transparent 70%);
      opacity: 0;
      transition: opacity var(--transition);
      border-radius: var(--radius);
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-glow);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }

    .card:hover::before { opacity: 1; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .5rem;
    }

    .card-icon {
      font-size: 1.75rem;
      line-height: 1;
    }

    .card-badge {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .2rem .55rem;
      border-radius: 999px;
      border: 1px solid currentColor;
      opacity: .7;
    }

    .card-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-desc {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: .25rem;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
    }

    .tag {
      font-size: .72rem;
      padding: .2rem .55rem;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
    }

    .card-arrow {
      color: var(--muted);
      transition: transform var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .card:hover .card-arrow {
      transform: translate(3px, -3px);
      color: var(--accent-1);
    }

    /* ─── Empty state ───────────────────────────────────────── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: .95rem;
    }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 4rem 0 2.5rem;
      color: var(--muted);
      font-size: .85rem;
    }

    footer a { color: var(--muted); text-underline-offset: 3px; }
    footer a:hover { color: var(--text); }

    /* ─── Responsive ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .logo { font-size: 2rem; }
      .card-grid { grid-template-columns: 1fr; }
    }

    /* ─── Lock Screen ───────────────────────────────────────── */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    #lock-screen.hidden { display: none; }

    .lock-card {
      width: 100%;
      max-width: 340px;
      padding: 2.5rem 2rem;
      margin: 0 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
    }

    .lock-logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .3rem;
    }

    .lock-hint {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 1.5rem;
    }

    #lock-password {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #lock-password:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px rgba(99,179,237,.12);
    }

    #lock-submit {
      width: 100%;
      margin-top: .75rem;
      padding: .7rem 1rem;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border: none;
      border-radius: 10px;
      color: #0d0f14;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
    }

    #lock-submit:hover { opacity: .9; transform: translateY(-1px); }

    #lock-error {
      margin-top: .9rem;
      font-size: .82rem;
      color: #fc8181;
      min-height: 1.1em;
    }

    .wrapper.hidden { display: none; }
  </style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-logo">HETZA</div>
    <p class="lock-hint">Ange lösenord för att fortsätta</p>
    <input id="lock-password" type="password" placeholder="Lösenord" autocomplete="off" autofocus />
    <button id="lock-submit">Lås upp</button>
    <p id="lock-error"></p>
  </div>
</div>

<div class="wrapper hidden" id="wrapper">

  <header>
    <div class="logo">HETZA</div>
    <p class="tagline">Appar &amp; verktyg byggda av Alexander Henke</p>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" type="text" placeholder="Sök appar…" autocomplete="off" />
    </div>
  </header>

  <main id="main"></main>

  <footer>
    <p>© 2026 Hetza — <a href="https://github.com/mhalex-coder" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   LÅSSKÄRM — enkel klientsidsspärr

   OBS: Detta är INTE riktig säkerhet — det är en enkel spärr som
   döljer länkarna för slumpmässiga besökare. Lösenordet lagras
   som en SHA-256-hash nedan istället för i klartext, men koden är
   fortfarande synlig för alla och går att kringgå via DevTools.

   Byt lösenord: kör i webbläsarens konsol
     crypto.subtle.digest("SHA-256", new TextEncoder().encode("nytt-lösenord"))
       .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
   och klistra in resultatet nedan.
═══════════════════════════════════════════════════════════════ */

const LOCK_PASSWORD_HASH = "890d29e6bf063536d325915d8bd216ddd7c444e97a63264c13fc2dc5505ec064";
const LOCK_STORAGE_KEY = "hetza_unlocked";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function unlockSite() {
  document.getElementById("lock-screen").classList.add("hidden");
  document.getElementById("wrapper").classList.remove("hidden");
}

async function attemptUnlock() {
  const input = document.getElementById("lock-password");
  const error = document.getElementById("lock-error");
  const hash = await sha256(input.value);

  if (hash === LOCK_PASSWORD_HASH) {
    sessionStorage.setItem(LOCK_STORAGE_KEY, "1");
    unlockSite();
  } else {
    error.textContent = "Fel lösenord, försök igen.";
    input.value = "";
    input.focus();
  }
}

if (sessionStorage.getItem(LOCK_STORAGE_KEY) === "1") {
  unlockSite();
} else {
  document.getElementById("lock-submit").addEventListener("click", attemptUnlock);
  document.getElementById("lock-password").addEventListener("keydown", e => {
    if (e.key === "Enter") attemptUnlock();
  });
}

/* ═══════════════════════════════════════════════════════════════
   KONFIGURATION — Lägg till / redigera appar här
   ═══════════════════════════════════════════════════════════════

   Fält per app:
     name    — Visningsnamn  (obligatoriskt)
     desc    — Kort beskrivning
     url     — Länk till repo eller live-app
     icon    — Emoji-ikon
     badge   — Kort status-badge, t.ex. "Live", "Beta", "WIP"
     tags    — Array med tekniker / nyckelord
     accent  — Accentfärg för kort-hover (valfritt)

   Lägg till en ny app genom att kopiera ett objekt och justera värdena.
═══════════════════════════════════════════════════════════════ */

const CATEGORIES = [
  {
    id: "ekonomi",
    name: "Privat Ekonomi",
    color: "#68d391",   /* grön */
    apps: [
      {
        name: "Aktie-Screener",
        desc: "Screena och filtrera aktier efter nyckeltal för att hitta investeringsmöjligheter.",
        url: "https://mhalex-coder.github.io/aktie",
        icon: "📈",
        badge: "Live",
        tags: ["Aktier", "Screener"],
        accent: "rgba(104,211,145,0.08)",
      },
      {
        name: "FIRE-Kalkylator",
        desc: "Planera ekonomiskt oberoende med hinkstrategin — beräkna när du kan gå i pension.",
        url: "https://mhalex-coder.github.io/FIRE",
        icon: "🔥",
        badge: "Live",
        tags: ["FIRE", "Pensionsplanering"],
        accent: "rgba(246,173,85,0.08)",
      },
      {
        name: "Marknadsrisk Indikator",
        desc: "Dashboard för att övervaka aktuella marknadsrisknivåer och identifiera riskläget på börsen..",
        url: "https://mhalex-coder.github.io/riskind/",
        icon: "🌡️",
        badge: "Live",
        tags: ["Marknadsrisk", "Dashboard"],
        accent: "rgba(246,173,85,0.08)",
      },
      /* ── Lägg till fler ekonomi-appar här ── */
    ],
  },
  {
    id: "automation",
    name: "Industriell Automation",
    color: "#63b3ed",   /* blå */
    apps: [
      {
        name: "Toolbox",
        desc: "Svit av eldesignverktyg för skåpbyggare och automationsingenjörer — märkning, effektberäkning och säkerhet.",
        url: "https://mhalex-coder.github.io/toolbox",
        icon: "🧰",
        badge: "Live",
        tags: ["El-design", "Beräkning", "IEC"],
        accent: "rgba(99,179,237,0.08)",
      },
      {
        name: "Safe Distance",
        desc: "Beräkna minsta skyddsavstånd för skyddsanordningar enligt maskindirektivet och ISO 13855.",
        url: "https://mhalex-coder.github.io/safedistance",
        icon: "🛡️",
        badge: "Live",
        tags: ["Säkerhet", "ISO 13855", "Maskindirektivet"],
        accent: "rgba(183,148,244,0.08)",
      },
      {
        name: "Building Blocks",
        desc: "Modulär arkitektur för automationssystem — bygg och visualisera systemblocksdiagram.",
        url: "https://mhalex-coder.github.io/BB",
        icon: "🧱",
        badge: "Live",
        tags: ["Arkitektur", "Modulär"],
        accent: "rgba(99,179,237,0.08)",
      },
      {
        name: "TimeGrid",
        desc: "Kapacitetsplaneringsverktyg för projekt och resurser med visuellt schema, rapporter och beläggningsanalys.",
        url: "https://mhalex-coder.github.io/Timegrid",
        icon: "📅",
        badge: "Live",
        tags: ["Kapacitetsplanering", "Resursallokering"],
        accent: "rgba(104,211,145,0.08)",
      },
      /* ── Lägg till fler automation-appar här ── */
    ],
  },
];

/* ════════════════════════════════════════════════════════════════
   Renderingslogik — rör ej om du inte vill ändra layout
════════════════════════════════════════════════════════════════ */

function buildCard(app) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = app.url || "#";
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  if (app.accent) a.style.setProperty("--card-accent", app.accent);

  a.innerHTML = `
    <div class="card-top">
      <span class="card-icon">${app.icon ?? "📦"}</span>
      ${app.badge ? `<span class="card-badge">${app.badge}</span>` : ""}
    </div>
    <div class="card-name">${app.name}</div>
    <div class="card-desc">${app.desc ?? ""}</div>
    <div class="card-footer">
      <div class="card-tags">
        ${(app.tags ?? []).map(t => `<span class="tag">${t}</span>`).join("")}
      </div>
      <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M7 17 17 7M7 7h10v10"/>
      </svg>
    </div>`;
  return a;
}

function buildCategory(cat) {
  const section = document.createElement("section");
  section.className = "category";
  section.dataset.id = cat.id;

  const header = document.createElement("div");
  header.className = "category-header";
  header.innerHTML = `
    <span class="category-dot" style="background:${cat.color}"></span>
    <span class="category-title">${cat.name}</span>
    <span class="category-line"></span>
    <span class="category-count">${cat.apps.length}</span>`;

  const grid = document.createElement("div");
  grid.className = "card-grid";

  cat.apps.forEach(app => grid.appendChild(buildCard(app)));

  section.appendChild(header);
  section.appendChild(grid);
  return section;
}

function render(query = "") {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const q = query.toLowerCase().trim();

  CATEGORIES.forEach(cat => {
    const filtered = q
      ? cat.apps.filter(a =>
          [a.name, a.desc, ...(a.tags ?? [])].join(" ").toLowerCase().includes(q))
      : cat.apps;

    if (q && filtered.length === 0) return;

    const catClone = { ...cat, apps: q ? filtered : cat.apps };
    const section = buildCategory(catClone);

    if (q && filtered.length === 0) {
      section.querySelector(".card-grid").innerHTML =
        `<div class="empty">Inga träffar i denna kategori.</div>`;
    }

    main.appendChild(section);
  });

  if (!main.children.length) {
    main.innerHTML = `<div class="empty" style="margin-top:3rem">
      Inga appar matchar "<strong>${query}</strong>".</div>`;
  }
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
