<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HETZA - Modern Design</title>
    <style>
        :root {
            --primary-text-color: #f0f0f0;
            --secondary-text-color: #aaaaaa;
            --background-dark: #1a1a1a;
            --container-bg: #222222;
            --accent-color: #00ccff;
            --border-color: #333333;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background-color: var(--background-dark);
            color: var(--primary-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
        }

        .container {
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            z-index: 10;
            border: 1px solid var(--border-color);
        }

        .logo-img {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-text-color);
            font-size: 2.5em;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            color: var(--secondary-text-color);
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--background-dark);
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="HETZA Logo" class="logo-img">
        
        <h1>HETZA</h1>
        <p>
            Välkommen till en plattform designad för effektivitet och analys. 
            Vi strävar efter att leverera precision i varje detalj med fokus 
            på optimering och prestanda.
        </p>
        <a href="#" class="button">Kom igång</a>
        <p class="footer">© 2024 HETZA. Alla rättigheter reserverade.</p>
    </div>
</body>
</html>
